# PostgreSQL local para desarrollo y pruebas de integración.
# Uso: copiar .env.example a .env, definir POSTGRES_PASSWORD y ejecutar `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    container_name: cad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cad}
      POSTGRES_USER: ${POSTGRES_USER:-cad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cad-pgdata:
